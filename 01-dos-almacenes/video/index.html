    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let listo;
      window.__hf.buildReady["mundo"] = new Promise((r) => (listo = r));
      await Promise.all(["900 92px Montserrat", "800 40px Montserrat"].map((f) => document.fonts.load(f)));
      const Mu = await import("./assets/mundo.js");
      const { T, objetos: O, aPantalla } = Mu;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const hud = document.getElementById("hud");
      const ico = {
        caja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
        mano: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.5"/><path d="M2.5 20c.8-4 3.4-6 6.5-6s5.7 2 6.5 6"/><path d="M17 8.5l2 2 3.5-4"/></svg>',
        fuga: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="11" rx="2"/><circle cx="12" cy="10.5" r="2.5"/><path d="M8 20l-1 2M12 19v3M16 20l1 2"/></svg>',
      };
      // Etiquetas pegadas a objetos 3D: [texto, clase, objeto, punto local, mitad, desde, hasta, dx, dy]
      const ET = [
        ["SUCURSAL 2", "l", O.S2.g, [0, 6.2, 0], "bot", T.tres + 0.3, T.suerte + 0.2],
        ["SUCURSAL 3", "l", O.S3.g, [0, 6.2, 0], "bot", T.tres + 0.6, T.suerte + 0.2],
        ["MIRA LO QUE ENTRA", "m", O.M.g, [2.45, 2.7, 0.6], "top", T.caja1, T.millon - 0.2],
        ["MIRA LO QUE QUEDA", "l", O.L.g, [2.45, 2.4, 0.6], "bot", T.queda1, T.millon - 0.2],
        ["−10 % DE DESCUENTO", "m", O.M.g, [0, 2.6, -4.6], "top", T.ahorra - 0.1, T.parada - 0.1],
        ["PLATA QUIETA · 60 DÍAS", "oro", O.M.g, [0, 2.6, -4.6], "top", T.parada - 0.05, T.lucas2 - 0.3],
        ["VUELVE A LA CAJA CADA SEMANA", "l", O.L.g, [1.4, 1.9, -4.3], "bot", T.vuelve2 - 0.1, T.d3 - 0.2],
        [() => String(Mu.yerbaEnEstanteM(tt)), "m grande", O.M.gond, [0, 3.35, 0], "top", T.inflacion + 0.1, T.d4 - 0.15],
        ["PARA LA CASA", "m", O.M.g, [2.9, 2.6, 0.6], "top", T.casa + 0.3, T.gratis - 0.15],
        ["¿GANA O TRABAJA GRATIS?", "m grande", O.M.dueno, [0, 1.9, 0], "top", T.gratis - 0.1, T.sueldo - 0.45],
        ["SUELDO FIJO", "l grande", O.L.dueno, [0, 1.9, 0], "bot", T.sueldo + 0.5, T.d6 - 0.25],
        ["+2 EMPLEADOS", "m", O.M.emp[0], [0, 1.95, 0], "top", T.contrato + 0.15, T.camioneta - 0.1],
        ["CAMIONETA EN CUOTAS", "m", O.camioneta, [0, 2.2, 0], "top", T.camioneta + 0.15, T.costos - 0.15],
        ["SUCURSAL 2", "l grande", O.S2.g, [0, 6.4, 0], "bot", T.abrio + 0.15, T.d7 - 0.45],
        ["¿TENÉS YERBA?", "", O.cliente, [0, 1.9, 0], "top", T.yerbaP - 0.1, T.nohay - 0.1],
        ["NO HAY", "m grande", O.M.dueno, [0, 1.95, 0], "top", T.nohay - 0.05, T.productos - 0.1],
        ["TRAEN GENTE: YERBA · PAN · LECHE", "oro", O.M.gond, [0, 3.4, 0], "top", T.productos - 0.1, T.cruza - 0.15],
        ["SE LLEVA TODA LA COMPRA", "m", O.cliente, [0, 1.9, 0], "top", T.compra - 0.25, T.lucas7 - 0.1],
        ["A LUCAS NUNCA LE FALTAN", "l grande", O.L.g, [0, 5.6, 2], "top", T.lucas7 - 0.05, T.loco - 0.15],
        ["+ FACTURACIÓN", "m grande", O.M.g, [0, 3.0, 2], "top", T.facturaba - 0.1, T.dif - 0.1],
        ["+ GENTE", "m", O.M.g, [-1.8, 2.3, 2.2], "top", T.facturaba + 0.3, T.dif - 0.1],
        ["SUCURSAL 2", "l", O.S2.g, [0, 6.2, 0], "bot", T.cierre + 0.4, T.marca],
        ["SUCURSAL 3", "l", O.S3.g, [0, 6.2, 0], "bot", T.cierre + 0.6, T.marca],
      ];
      let tt = 0;
      const els = ET.map((e, i) => { const d = document.createElement("div"); d.className = "tag " + e[1]; d.id = "tag" + i; hud.appendChild(d); return d; });
      // Manual que Lucas le pasa al empleado
      const man = document.createElement("div"); man.className = "manual"; man.innerHTML = "<b>CÓMO SE HACE</b><i>Arqueo de caja</i><i>Stock mínimo</i><i>Fiado: límite</i>"; hud.appendChild(man);
      const dimT = document.getElementById("dimTop"), dimB = document.getElementById("dimBot"), div = document.getElementById("divisor");
      const cinta = document.querySelector("#anio .cinta"), anioEl = document.getElementById("anio"), rew = document.getElementById("rew");
      const decEl = document.getElementById("dec"), decN = document.getElementById("dec-n"), decI = [...document.querySelectorAll("#dec-barra i")];
      function hudAt(t) {
        tt = t;
        const { d } = Mu.render(t);
        dimT.style.top = "0px"; dimT.style.height = d + "px"; dimT.style.opacity = Mu.dimTop(t);
        dimB.style.top = d + "px"; dimB.style.height = 1920 - d + "px"; dimB.style.opacity = Mu.dimBot(t);
        const vis = d > 30 && d < 1890 && !(t > T.cierre + 0.1 && t < T.marca);
        div.style.top = d + "px"; div.style.opacity = vis ? 1 : 0;
        anioEl.style.opacity = vis && !(t > 9.85 && t < 13.2) && !(t > T.millon - 0.2 && t < T.d2 - 0.1) && !(t > T.d3 - 0.1 && t < T.inflacion - 0.4) && !(t > T.d4 - 0.1 && t < T.d5 - 0.3) && !(t > T.costos - 0.15 && t < T.lucas6 - 0.3) && !(t > T.dif - 0.15 && t < T.cierre) ? 1 : 0;
        cinta.style.transform = `translateY(${-64 * Mu.anio(t)}px)`;
        const dn = Mu.decision(t);
        const decOn = dn > 0 && !(t > T.millon - 0.2 && t < T.d2 - 0.1) && !(t > T.d3 - 0.1 && t < T.inflacion - 0.4);
        decEl.style.opacity = decOn ? 1 : 0;
        if (dn > 0) { decN.textContent = dn; decI.forEach((e, k) => (e.className = k + 1 < dn ? "ok" : k + 1 === dn ? "ya" : ""));
          const t0 = [T.d1, T.d2, T.d3, T.d4, T.d5, T.d6, T.d7][dn - 1] - 0.1; const u = clamp((t - t0) / 0.35);
          decEl.style.transform = `scale(${1 + 0.12 * Math.sin(u * Math.PI)})`; }
        rew.style.opacity = t > T.suerte + 0.15 && t < T.suerte + 1.1 ? 0.85 : 0;
        ET.forEach((e, i) => {
          const [txt, , obj, loc, mitad, a, b, dx = 0, dy = 0] = e; const el = els[i];
          const on = t >= a && t < b;
          if (!on) { el.style.opacity = 0; return; }
          const s = aPantalla(obj, loc, mitad, t);
          const u = clamp((t - a) / 0.25), out = clamp((b - t) / 0.18);
          el.innerHTML = typeof txt === "function" ? txt() : txt;
          const w = el.offsetWidth, h = el.offsetHeight;
          let x = s.x - w / 2 + dx, y = s.y - h - 18 + dy;
          if (dx) x = s.x + dx; x = Math.min(1080 - w - 24, Math.max(24, x));
          y = Math.min(s.y0 + s.h - h - 10, Math.max(s.y0 + (s.y0 > 0 ? 60 : 280), y));
          el.style.opacity = s.vis ? Math.min(u, out) : 0;
          el.style.transform = `translate(${x}px, ${y + (1 - u) * 24}px) scale(${0.85 + 0.15 * (1 - Math.pow(1 - u, 3))})`;
        });
        // manual
        const ma = 1e9, mb = 1e9; // sin manual en esta versión
        if (t >= ma && t < mb) {
          const s0 = aPantalla(O.L.dueno, [0, 1.6, 0], "bot", t), s1 = aPantalla(O.L.emp[0], [0, 2.0, 0], "bot", t);
          const u = clamp((t - ma) / 0.7); const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
          const x = s0.x + (s1.x - s0.x) * e - 330, y = s0.y + (s1.y - s0.y) * e - 260 - Math.sin(e * Math.PI) * 80;
          man.style.opacity = Math.min(1, u * 4, clamp((mb - t) / 0.2));
          man.style.transform = `translate(${Math.max(24, x)}px, ${Math.max(s0.y0 + 12, y)}px) rotate(${(1 - e) * -8}deg)`;
        } else man.style.opacity = 0;
      }
      window.addEventListener("hf-seek", (e) => hudAt(e.detail.time));
      hudAt(0);
      listo();
    </script>
