<!doctype html>
<html lang="es"
  data-composition-variables='[
    {"id":"color-martin","type":"color","label":"Color Martín","default":"#E0482F"},
    {"id":"color-lucas","type":"color","label":"Color Lucas","default":"#12A06B"},
    {"id":"color-tinta","type":"color","label":"Tinta","default":"#17161A"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat.woff2") format("woff2"); font-weight: 400 700; }
      :root { --color-martin: #E0482F; --color-lucas: #12A06B; --color-tinta: #17161A; --oro: #F2B630; --papel: #FFF9EE; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #EFE6D6; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Montserrat"; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
      .dim { position: absolute; left: 0; width: 1080px; background: #17161A; opacity: 0; }
      #divisor { position: absolute; left: 0; width: 1080px; height: 0; }
      #divisor .linea { position: absolute; left: 0; right: 0; top: -5px; height: 10px; background: #FFF9EE; box-shadow: 0 0 0 3px #17161A; }
      #anio { position: absolute; left: 50%; top: -46px; width: 260px; margin-left: -130px; height: 92px; border-radius: 18px;
        background: #17161A; color: #FFF9EE; display: flex; align-items: center; justify-content: center; gap: 14px;
        font-weight: 900; font-size: 50px; letter-spacing: 0.02em; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
      #anio .rodillo { position: relative; width: 44px; height: 64px; overflow: hidden; }
      #anio .cinta { position: absolute; left: 0; top: 0; width: 44px; }
      #anio .cinta div { height: 64px; line-height: 64px; text-align: center; color: var(--oro); }
      .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; font-size: 38px; color: #fff; padding: 10px 20px;
        border-radius: 14px; background: #17161A; box-shadow: 0 6px 0 rgba(0,0,0,.2); opacity: 0; }
      .tag::after { content: ""; position: absolute; left: 50%; bottom: -14px; margin-left: -12px; border: 12px solid transparent; border-bottom: 0; border-top: 14px solid #17161A; }
      .tag.m { background: var(--color-martin); } .tag.m::after { border-top-color: var(--color-martin); }
      .tag.l { background: var(--color-lucas); } .tag.l::after { border-top-color: var(--color-lucas); }
      .tag.oro { background: var(--oro); color: #17161A; } .tag.oro::after { border-top-color: var(--oro); }
      .tag.izq::after { display: none; }
      .tag svg { width: 40px; height: 40px; vertical-align: -9px; margin-right: 10px; }
      .tag.grande { font-size: 64px; font-weight: 900; padding: 8px 26px; }
      .manual { position: absolute; left: 0; top: 0; width: 380px; padding: 20px 22px; border-radius: 16px; background: var(--papel);
        color: #17161A; font-weight: 800; font-size: 30px; box-shadow: 0 10px 0 rgba(0,0,0,.18); opacity: 0; }
      .manual b { display: block; font-weight: 900; font-size: 34px; margin-bottom: 8px; color: var(--color-lucas); }
      .manual i { display: block; font-style: normal; padding: 4px 0 4px 40px; position: relative; }
      .manual i::before { content: ""; position: absolute; left: 0; top: 9px; width: 26px; height: 26px; border-radius: 6px; background: var(--color-lucas); }
      #rew { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-weight: 900; font-size: 120px; color: #FFF9EE;
        -webkit-text-stroke: 14px #17161A; paint-order: stroke fill; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="97" data-width="1080" data-height="1920">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="hud" data-layout-ignore>
        <div class="dim" id="dimTop"></div>
        <div class="dim" id="dimBot"></div>
        <div id="divisor"><div class="linea"></div>
          <div id="anio">AÑO <div class="rodillo"><div class="cinta"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div></div></div>
        </div>
        <div id="rew">◀◀</div>
      </div>

      <div id="o-gancho" data-composition-id="o-gancho" data-composition-src="compositions/o-gancho.html" data-start="0" data-duration="11.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="o-cuaderno" data-composition-id="o-cuaderno" data-composition-src="compositions/o-cuaderno.html" data-start="30.9" data-duration="12.2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="o-precio" data-composition-id="o-precio" data-composition-src="compositions/o-precio.html" data-start="56.0" data-duration="9.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="o-yerba" data-composition-id="o-yerba" data-composition-src="compositions/o-yerba.html" data-start="65.8" data-duration="9.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="o-tijera" data-composition-id="o-tijera" data-composition-src="compositions/o-tijera.html" data-start="82.0" data-duration="3.7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="o-cierre" data-composition-id="o-cierre" data-composition-src="compositions/o-cierre.html" data-start="85.55" data-duration="11.45" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="subtitulos" data-composition-id="subtitulos" data-composition-src="compositions/subtitulos.html" data-start="0" data-duration="97" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:20"></div>

      <audio id="voz" class="clip" src="assets/audio/voz.wav" data-start="0" data-duration="95.22" data-track-index="5" data-volume="1"></audio>
      <audio id="musica" class="clip" src="assets/audio/musica.wav" data-start="0" data-duration="97" data-track-index="6" data-volume="1"></audio>
      <audio id="efectos" class="clip" src="assets/audio/efectos.wav" data-start="0" data-duration="97" data-track-index="7" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let listo;
      window.__hf.buildReady["mundo"] = new Promise((r) => (listo = r));
      await Promise.all(["900 92px Montserrat", "800 40px Montserrat"].map((f) => document.fonts.load(f)));
      const Mu = await import("./assets/mundo.js");
      const { T, objetos: O, aPantalla } = Mu;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const hud = document.getElementById("hud");
      const ico = {
        caja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
        mano: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.5"/><path d="M2.5 20c.8-4 3.4-6 6.5-6s5.7 2 6.5 6"/><path d="M17 8.5l2 2 3.5-4"/></svg>',
        fuga: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="11" rx="2"/><circle cx="12" cy="10.5" r="2.5"/><path d="M8 20l-1 2M12 19v3M16 20l1 2"/></svg>',
      };
      // Etiquetas pegadas a objetos 3D: [texto, clase, objeto, punto local, mitad, desde, hasta, dx, dy]
      const T0 = T;
      const yerbaN = (t) => {
        let n = 10;
        for (let i = 0; i < 10; i++) {
          const vende = T.diez - 0.3 + i * 0.1, vuelve = T.plataY + 1.25 + i * 0.09;
          const sale2 = i >= 6 ? T.cadaVez + 0.3 + (9 - i) * 0.12 : i === 5 ? T.cadaVez + 0.85 : i === 4 ? T.cadaVez + 1.35 : 1e9;
          if (t >= vende + 0.25) n--; if (i < 8 && t >= vuelve + 0.2) n++; if (i < 8 && t >= sale2 + 0.15) n--;
        }
        return n;
      };
      const ET = [
        ["CAJERO", "m", O.M.emp[0], [0, 1.95, 0], "top", T.cajero + 0.1, T.desde + 0.9],
        ["REPOSITOR", "m", O.M.emp[1], [0, 1.95, 0], "top", T.repositor + 0.1, T.desde + 0.9],
        ["SUCURSAL 2", "l", O.S2.g, [0, 6.2, 0], "bot", T.tres + 0.3, T.suerte + 0.2],
        ["SUCURSAL 3", "l", O.S3.g, [0, 6.2, 0], "bot", T.tres + 0.6, T.suerte + 0.2],
        [ico.caja + "QUÉ SE VENDE", "l izq", O.L.dueno, [0, 1.9, 0], "bot", T.vende - 0.1, T.contrato - 0.1, -330, -330],
        [ico.mano + "A QUIÉN FIARLE", "l izq", O.L.dueno, [0, 1.9, 0], "bot", T.fiarle - 0.1, T.contrato - 0.1, -330, -240],
        [ico.fuga + "DÓNDE SE ESCAPA LA PLATA", "l izq", O.L.dueno, [0, 1.9, 0], "bot", T.escapa - 0.1, T.contrato - 0.1, -330, -150],
        [() => "−" + 2 * Math.min(3, Math.max(1, Math.floor((tt - T.sueldos - 0.4) / 0.5) + 1)) + " monedas en sueldos", "m", O.M.g, [-4.15, 2.0, 2.8], "top", T.sueldos + 0.4, T.nunca - 0.1],
        ["¿CUÁNTO FALTA?", "m", O.M.g, [2.45, 2.7, 0.6], "top", T.nunca + 0.4, T.cuaderno - 0.1],
        ["PLATA PARADA", "oro", O.M.g, [0, 2.6, -4.6], "top", T.parada - 0.1, T.lucasCompra - 0.2],
        ["COMPRA REPETIDA", "m", O.M.g, [-1.2, 2.25, -4.6], "top", T.repetidas - 0.1, T.lucasCompra - 0.2, 0, 90],
        ["POCO Y SEGUIDO", "l", O.L.g, [2.2, 1.9, -4.3], "bot", T.lucasCompra + 0.6, T.segunda - 0.1],
        ["1 DE CADA 3 PEDIDOS", "l grande", O.anillo, [0, 0, -2], "bot", T.tercio + 2.6, T.abrio - 0.6],
        ["SUCURSAL 2", "l grande", O.S2.g, [0, 6.4, 0], "bot", T.abrio + 0.15, T.pero - 0.1],
        [() => String(yerbaN(tt)), "m grande", O.M.gond, [0, 3.35, 0], "top", T.diez - 0.6, T.sentia - 0.1],
        ["CAJA LLENA", "oro grande", O.M.g, [2.45, 3.0, 0.6], "top", T.llena - 0.05, T.loco - 0.1],
        ["ESTANTE CASI VACÍO", "m", O.M.gond, [0, 2.6, 0], "top", T.llena + 0.35, T.loco - 0.1],
        ["SIEMPRE 10", "l grande", O.L.gond, [0, 0.55, 0.6], "bot", T.llena + 0.2, T.loco - 0.1],
        ["+ EMPLEADOS", "m", O.M.emp[2], [0, 1.95, 0], "top", T.mas1 + 0.3, T.dif - 0.1],
        ["+ MERCADERÍA", "m", O.M.gond, [-1.4, 3.3, 0], "top", T.mas2, T.dif - 0.1],
        ["+ MOVIMIENTO", "m", O.M.g, [-1.8, 2.3, 2.2], "top", T.mas3 + 0.2, T.dif - 0.1],
        ["SUCURSAL 2", "l", O.S2.g, [0, 6.2, 0], "bot", T.cual + 0.4, T.FIN],
        ["SUCURSAL 3", "l", O.S3.g, [0, 6.2, 0], "bot", T.cual + 0.6, T.FIN],
      ];
      let tt = 0;
      const els = ET.map((e, i) => { const d = document.createElement("div"); d.className = "tag " + e[1]; d.id = "tag" + i; hud.appendChild(d); return d; });
      // Manual que Lucas le pasa al empleado
      const man = document.createElement("div"); man.className = "manual"; man.innerHTML = "<b>CÓMO SE HACE</b><i>Arqueo de caja</i><i>Stock mínimo</i><i>Fiado: límite</i>"; hud.appendChild(man);
      const dimT = document.getElementById("dimTop"), dimB = document.getElementById("dimBot"), div = document.getElementById("divisor");
      const cinta = document.querySelector("#anio .cinta"), anioEl = document.getElementById("anio"), rew = document.getElementById("rew");
      function hudAt(t) {
        tt = t;
        const { d } = Mu.render(t);
        dimT.style.top = "0px"; dimT.style.height = d + "px"; dimT.style.opacity = Mu.dimTop(t);
        dimB.style.top = d + "px"; dimB.style.height = 1920 - d + "px"; dimB.style.opacity = Mu.dimBot(t);
        const vis = d > 30 && d < 1890;
        div.style.top = d + "px"; div.style.opacity = vis ? 1 : 0;
        anioEl.style.opacity = vis && !(t > 30.95 && t < 43.0) && !(t > 56.05 && t < 65.6) && !(t > 82.0 && t < 93.95) ? 1 : 0;
        cinta.style.transform = `translateY(${-64 * Mu.anio(t)}px)`;
        rew.style.opacity = t > T.suerte + 0.15 && t < T.suerte + 1.2 ? 0.85 : 0;
        ET.forEach((e, i) => {
          const [txt, , obj, loc, mitad, a, b, dx = 0, dy = 0] = e; const el = els[i];
          const on = t >= a && t < b;
          if (!on) { el.style.opacity = 0; return; }
          const s = aPantalla(obj, loc, mitad, t);
          const u = clamp((t - a) / 0.25), out = clamp((b - t) / 0.18);
          el.innerHTML = typeof txt === "function" ? txt() : txt;
          const w = el.offsetWidth, h = el.offsetHeight;
          let x = s.x - w / 2 + dx, y = s.y - h - 18 + dy;
          if (dx) x = s.x + dx; x = Math.min(1080 - w - 24, Math.max(24, x));
          y = Math.min(s.y0 + s.h - h - 10, Math.max(s.y0 + (s.y0 > 0 ? 60 : 10), y));
          el.style.opacity = s.vis ? Math.min(u, out) : 0;
          el.style.transform = `translate(${x}px, ${y + (1 - u) * 24}px) scale(${0.85 + 0.15 * (1 - Math.pow(1 - u, 3))})`;
        });
        // manual
        const ma = T.sabia - 0.2, mb = T.sueldos - 0.3;
        if (t >= ma && t < mb) {
          const s0 = aPantalla(O.L.dueno, [0, 1.6, 0], "bot", t), s1 = aPantalla(O.L.emp[0], [0, 2.0, 0], "bot", t);
          const u = clamp((t - ma) / 0.7); const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
          const x = s0.x + (s1.x - s0.x) * e - 330, y = s0.y + (s1.y - s0.y) * e - 260 - Math.sin(e * Math.PI) * 80;
          man.style.opacity = Math.min(1, u * 4, clamp((mb - t) / 0.2));
          man.style.transform = `translate(${Math.max(24, x)}px, ${Math.max(s0.y0 + 12, y)}px) rotate(${(1 - e) * -8}deg)`;
        } else man.style.opacity = 0;
      }
      window.addEventListener("hf-seek", (e) => hudAt(e.detail.time));
      hudAt(0);
      listo();
    </script>
  </body>
</html>
