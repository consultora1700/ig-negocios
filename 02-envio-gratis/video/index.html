<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* EL MÉTODO EMPRESARIAL — capa de marca (ver /root/ig-negocios/marca/MARCA.md y /root/reels-ref/EDICION.md) */
      :root { --plata-c: #E5E7EB; --plata-m: #BFC4CC; --plata-o: #9299A3; --azul-l: #00CFFF;
        --g-azul: linear-gradient(110deg, #0057D9 0%, #007BFF 35%, #009DFF 70%, #00CFFF 100%); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000000; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Montserrat"; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
      #marca { position: absolute; left: 44px; top: 96px; display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 12px; background: rgba(0,0,0,.72); }
      #marca img { width: 54px; height: 54px; }
      #marca span { font-weight: 800; font-size: 19px; line-height: 1.05; letter-spacing: 0.12em; color: var(--plata-c); }
      #marca span b { display: block; font-weight: 900; color: #FFFFFF; }
      #titulo { position: absolute; left: 0; right: 0; top: 196px; display: grid; justify-items: center; gap: 10px; }
      #titulo div { font-weight: 900; font-size: 64px; line-height: 1; letter-spacing: -0.01em; color: #FFFFFF; padding: 12px 26px 14px; border-radius: 10px; }
      #titulo .a { background: #000000; border: 3px solid #9299A3; }
      #titulo .b { background: var(--g-azul); }
      .ficha { position: absolute; left: 0; top: 0; background: #000000; border-radius: 14px; padding: 14px 24px 16px 30px; opacity: 0; border: 2px solid #3A3E46; }
      .ficha::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; border-radius: 14px 0 0 14px; background: var(--g-azul); }
      .ficha::after { content: ""; position: absolute; left: 50%; bottom: -16px; margin-left: -14px; border: 14px solid transparent; border-bottom: 0; border-top: 16px solid #3A3E46; }
      .ficha small { display: block; font-weight: 800; font-size: 24px; letter-spacing: 0.16em; color: var(--plata-m); }
      .ficha b { display: block; font-weight: 900; font-size: 60px; line-height: 1.04; color: #FFFFFF; white-space: nowrap; }
      .ficha.azul { background: var(--g-azul); border-color: #00CFFF; } .ficha.azul::before { display: none; } .ficha.azul::after { border-top-color: #007BFF; } .ficha.azul small { color: #E5F6FF; }
      .ficha.fija::after { display: none; }
      .ficha.gris::before { background: #9299A3; } .ficha.gris b { color: #BFC4CC; }
      .ficha.tachada b { text-decoration: line-through; text-decoration-thickness: 7px; text-decoration-color: #9299A3; color: #9299A3; }
      #grande { position: absolute; left: 50%; top: 470px; transform: translateX(-50%); width: 940px; text-align: center; background: rgba(0,0,0,.86); border: 2px solid #3A3E46; border-radius: 18px; padding: 22px 26px 26px; opacity: 0; }
      #grande small { display: block; font-weight: 800; font-size: 30px; letter-spacing: 0.14em; color: var(--plata-c); }
      #grande b { display: block; font-weight: 900; font-size: 92px; line-height: 1.04; margin-top: 6px; color: #FFFFFF; }
      #grande b.az { background: var(--g-azul); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #grande b.cita { font-size: 52px; line-height: 1.18; font-weight: 800; }
      #regla { position: absolute; left: 70px; right: 70px; top: 560px; display: grid; gap: 26px; opacity: 0; }
      #regla .et { justify-self: start; font-weight: 900; font-size: 30px; letter-spacing: 0.22em; color: #FFFFFF; background: var(--g-azul); padding: 10px 20px; border-radius: 10px; }
      #regla .l1 { font-weight: 900; font-size: 74px; line-height: 1.08; color: #FFFFFF; }
      #regla .l1 em { font-style: normal; background: var(--g-azul); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #regla .l2 { font-weight: 800; font-size: 50px; line-height: 1.15; color: var(--plata-c); opacity: 0; }
      #sub { position: absolute; left: 60px; right: 60px; top: 1330px; text-align: center; font-weight: 900; font-size: 64px; line-height: 1.1; color: #FFFFFF; -webkit-text-stroke: 12px #000000; paint-order: stroke fill; }
      #sub em { font-style: normal; color: var(--azul-l); }
      #fuente { position: absolute; left: 60px; right: 60px; top: 1478px; text-align: center; font-weight: 700; font-size: 24px; color: var(--plata-m); opacity: 0; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="70.3" data-width="1080" data-height="1920">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="hud" data-layout-ignore>
        <div id="marca"><img src="assets/marca/isotipo.png" alt=""><span>EL MÉTODO<b>EMPRESARIAL</b></span></div>
        <div id="titulo"><div class="a">Envío gratis:</div><div class="b">¿quién lo paga?</div></div>
        <div id="grande"><small id="grande-s"></small><b id="grande-b"></b></div>
        <div id="regla"><div class="et">LA REGLA</div><div class="l1">Lo que regalás tiene que traer algo <em>que se repite</em>.</div><div class="l2" id="regla2">Si el cliente no vuelve, no regalaste: perdiste.</div></div>
        <div id="sub"></div>
        <div id="fuente"></div>
      </div>
      <div id="o-marca" data-composition-id="o-marca" data-composition-src="compositions/o-marca.html" data-start="64.9" data-duration="5.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:30"></div>
      <audio id="voz" class="clip" src="assets/audio/voz.wav" data-start="0" data-duration="66.9" data-track-index="5" data-volume="1"></audio>
      <audio id="musica" class="clip" src="assets/audio/musica.wav" data-start="0" data-duration="70.3" data-track-index="6" data-volume="1"></audio>
      <audio id="efectos" class="clip" src="assets/audio/efectos.wav" data-start="0" data-duration="70.3" data-track-index="7" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let listo;
      window.__hf.buildReady["mundo"] = new Promise((r) => (listo = r));
      await Promise.all(["900 70px Montserrat", "800 34px Montserrat", "700 22px Montserrat"].map((f) => document.fonts.load(f)));
      const Mu = await import("./assets/mundo.js");
      const SUB = await fetch("assets/subtitulos.json").then((r) => r.json());
      const { T } = Mu;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const hud = document.getElementById("hud");
      // Fichas pegadas a objetos 3D: [rótulo, valor, clase, objeto, punto local, desde, hasta, corrimiento y]
      const FI = [
        ["LA COMPRA", "$15.000", "", Mu.cajaCompra, [0, 0.35, 0], T.compra - 0.1, T.gratis - 0.05],
        ["EL ENVÍO", "$0", "azul", Mu.cajaCompra, [0, 0.35, 0], T.gratis - 0.05, T.quien - 0.05],
        ["¿QUIÉN", "LO PAGÓ?", "", Mu.cajaCompra, [0, 0.35, 0], T.quien, T.creemos - 0.1],
        ["SUSCRIPTORES · DESDE", "$15.000", "", null, [60, 690], T.quince - 0.1, T.pero - 0.1],
        ["ANTES", "$33.000", "tachada", null, [60, 850], T.antes, T.pero - 0.1],
        ["EL ENVÍO LO PONE", "LA EMPRESA", "azul", null, [60, 1010], T.empresa, T.pero - 0.1],
        ["ARRIBA DE $33.000", "PAGA EL VENDEDOR", "", Mu.marcaGarage, [0, 0, 0], T.treinta, T.mitad - 0.1],
        ["LA MITAD DEL ENVÍO", "≈ $7.800", "azul", Mu.marcaMesa, [0, 0, 0], T.mitad, T.regala - 0.1],
        ["FACTURÓ", "US$ 10.750 M", "", Mu.marcaAlta, [0, 0, 0], T.facturo, T.vendio - 0.1],
        ["GANÓ", "US$ 448 M", "azul", Mu.marcaBaja, [0, 0, 0], T.gano, T.vendio - 0.1],
        ["GANANCIA POR PRODUCTO", "≈ US$ 0,52", "azul", Mu.marcaMoneda, [0, 0, 0], T.centavos + 0.3, T.porque - 0.1],
        ["EL ENVÍO GRATIS", "ES UN IMÁN", "azul", Mu.marcaIman, [0, 0, 0], T.iman, T.regla - 0.1],
        ["PUBLICIDAD", "+51 %", "azul", Mu.marcaDeposito, [0, 0, 0], T.crecio, T.regla - 0.1],
      ];
      const els = FI.map((f) => { const d = document.createElement("div"); d.className = "ficha " + f[2]; d.innerHTML = `<small>${f[0]}</small><b>${f[1]}</b>`; hud.appendChild(d); return d; });
      // Carteles grandes al centro: [desde, hasta, rótulo, texto, clase]
      const GR = [
        [T.regalo, T.alguien, "CASI TODOS CREEMOS", "¿UN REGALO?", ""],
        [T.alguien, T.septiembre, "NO EXISTE EL ENVÍO GRATIS", "ALGUIEN LO PAGA", "az"],
        [T.vendio, T.centavos, "VENDIÓ EN UN TRIMESTRE", "867 MILLONES", ""],
        [T.margen, T.porque, "LA PROPIA EMPRESA", "«Los envíos gratis le comieron margen»", "cita"],
      ];
      const FU = [[T.septiembre, T.pero, "Fuente: Forbes Argentina, septiembre de 2026"], [T.pero, T.regala, "Fuente: tarifas para vendedores con reputación verde, septiembre de 2026"],
        [T.regala, T.porque, "Fuente: MercadoLibre, resultados del 3.er trimestre de 2026 (SEC)"], [T.crecio, T.regla, "Publicidad +51 % sin efecto del tipo de cambio · 3T 2026"]];
      const sub = document.getElementById("sub"), grande = document.getElementById("grande"), gs = document.getElementById("grande-s"), gb = document.getElementById("grande-b");
      const fuente = document.getElementById("fuente"), titulo = document.getElementById("titulo"), regla = document.getElementById("regla"), regla2 = document.getElementById("regla2");
      function hudAt(t) {
        const enRegla = t >= T.regla && t < T.mandaselo;
        Mu.render(t, enRegla ? 0.72 * clamp((t - T.regla) / 0.4) * clamp((T.mandaselo - t) / 0.3) : 0);
        FI.forEach((f, i) => {
          const el = els[i], on = t >= f[5] && t < f[6];
          if (!on) { el.style.opacity = 0; return; }
          const u = clamp((t - f[5]) / 0.25), out = clamp((f[6] - t) / 0.15);
          const w = el.offsetWidth, h = el.offsetHeight; let x, y, s = { vis: true };
          if (f[3]) { s = Mu.aPantalla(f[3], f[4]); x = Math.min(1080 - w - 40, Math.max(40, s.x - w / 2)); y = Math.min(1180 - h, Math.max(440, s.y - h - 22)); }
          else { x = f[4][0]; y = f[4][1]; el.classList.add("fija"); }
          el.style.opacity = s.vis ? Math.min(u, out) : 0;
          el.style.transform = `translate(${x}px, ${y + (1 - u) * 26}px) scale(${0.86 + 0.14 * (1 - Math.pow(1 - u, 3))})`;
          if (f[2] === "tachada") el.classList.toggle("tachada", t > T.antes + 0.9);
        });
        let g = GR.find((r) => t >= r[0] && t < r[1]);
        if (g) { const u = clamp((t - g[0]) / 0.3), out = clamp((g[1] - t) / 0.2); grande.style.opacity = Math.min(u, out); grande.style.transform = `translateX(-50%) translateY(${(1 - u) * 26}px)`;
          gs.textContent = g[2]; gb.textContent = g[3]; gb.className = g[4]; } else grande.style.opacity = 0;
        let s = ""; for (const [a, txt] of SUB) if (t >= a) s = txt; sub.innerHTML = t < 64.85 && !enRegla ? s : "";
        const fu = FU.find((r) => t >= r[0] + 0.4 && t < r[1]); fuente.style.opacity = fu ? 1 : 0; if (fu) fuente.textContent = fu[2];
        titulo.style.opacity = enRegla || t >= 64.85 ? 0 : 1;
        const ur = clamp((t - T.regla - 0.2) / 0.4); regla.style.opacity = enRegla ? Math.min(ur, clamp((T.mandaselo - t) / 0.3)) : 0; regla.style.transform = `translateY(${(1 - ur) * 30}px)`;
        regla2.style.opacity = clamp((t - T.perdiste + 1.9) / 0.4);
      }
      window.addEventListener("hf-seek", (e) => hudAt(e.detail.time));
      hudAt(0);
      listo();
    </script>
  </body>
</html>
